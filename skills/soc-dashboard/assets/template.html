<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>__TITLE__</title>
<style id="soc-style">
:root{
  --accent:#0000f2;
  --paper:#f4f4f2; --ink:var(--accent);
  --muted:color-mix(in srgb,var(--ink) 66%,var(--paper));
  --rule:color-mix(in srgb,var(--ink) 20%,var(--paper));
  --wash:color-mix(in srgb,var(--ink) 6%,var(--paper));
  --c0:var(--ink);
  --c1:color-mix(in srgb,var(--ink) 70%,var(--paper));
  --c2:color-mix(in srgb,var(--ink) 46%,var(--paper));
  --c3:color-mix(in srgb,var(--ink) 30%,var(--paper));
  --c4:color-mix(in srgb,var(--ink) 19%,var(--paper));
  --c5:color-mix(in srgb,var(--ink) 11%,var(--paper));
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-cond:"Bahnschrift","Arial Narrow","Roboto Condensed","Helvetica Neue Condensed","Liberation Sans Narrow","Nimbus Sans Narrow","DejaVu Sans Condensed",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:color-mix(in srgb,var(--accent) 38%,#fff);
  --paper:color-mix(in srgb,var(--accent) 14%,#05050b);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:color-mix(in srgb,var(--accent) 38%,#fff);
    --paper:color-mix(in srgb,var(--accent) 14%,#05050b);
    color-scheme:dark;
  }
}
*{box-sizing:border-box;border-radius:0}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cap{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.mut{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}
header.top{padding:28px 0 18px}
h1{font:300 clamp(44px,8.2vw,112px)/.86 var(--f-cond);letter-spacing:-.01em;text-transform:uppercase;margin:10px 0 14px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-top:9px;padding-bottom:9px}
.search{flex:1 1 220px;min-width:180px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ink)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:13px;padding:4px 0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:2 1 300px}
.chip{border:1px solid var(--ink);padding:2px 8px;display:inline-flex;gap:8px;max-width:340px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:var(--ink);color:var(--paper)}
.act{display:flex;gap:16px}
.act button,.lnk{border-bottom:1px solid transparent}
.act button:hover,.lnk:hover{border-bottom-color:var(--ink)}
main.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(20px,3vw,44px);row-gap:0;padding-bottom:40px}
.panel{grid-column:span 12;border-top:1px solid var(--ink);padding:12px 0 26px;min-width:0}
.stack{grid-column:span 4;min-width:0}
.stack .panel{grid-column:auto}
.stack.w8{grid-column:span 8}.stack.w6{grid-column:span 6}
.panel.w8{grid-column:span 8}.panel.w6{grid-column:span 6}.panel.w4{grid-column:span 4}.panel.w3{grid-column:span 3}
@media (max-width:1000px){.panel.w8,.panel.w6,.panel.w4,.panel.w3,.stack,.stack.w8,.stack.w6{grid-column:span 12}}
@media (min-width:1001px) and (max-width:1250px){.panel.w4,.stack{grid-column:span 6}.stack.w8{grid-column:span 12}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.ph h2{margin:0;font:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));column-gap:clamp(20px,3vw,44px);border-top:1px solid var(--ink);padding-top:12px;grid-column:span 12}
.kpi{padding-bottom:22px;min-width:0}
.kpi .v{font:300 clamp(48px,6vw,84px)/.95 var(--f-cond);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:6px 0 4px}
.kpi svg{display:block;width:100%;height:26px}
.spark{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.sig{display:grid;grid-template-columns:76px 1fr auto;gap:4px 18px;padding:12px 0;border-top:1px solid var(--rule);align-items:start}
.sig:first-of-type{border-top:0;padding-top:0}
.sig .t{font:400 19px/1.15 var(--f-cond);letter-spacing:.01em}
@media (max-width:700px){.sig{grid-template-columns:1fr}.sig .btn{justify-self:start}}
.sig p{margin:4px 0 0;max-width:86ch;color:var(--muted)}
.sig details{margin-top:4px}
.sig summary{cursor:pointer;list-style:none;display:inline-block}
.sig summary::-webkit-details-marker{display:none}
.lvl{display:inline-flex;align-items:center;gap:7px}
.lvl i{display:inline-block;width:10px;height:10px;border:1px solid var(--ink)}
.lvl.high i{background:var(--ink)}.lvl.med i{background:linear-gradient(to top,var(--ink) 50%,transparent 50%)}
.btn{border:1px solid var(--ink);padding:3px 10px;white-space:nowrap}
.btn:hover,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rk{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:14px;width:100%;padding:5px 0 6px;position:relative;align-items:baseline}
.rk .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .b{grid-column:1/-1;height:3px;background:var(--wash);margin-top:3px}
.rk .b i{display:block;height:100%;background:var(--c2)}
.rk:hover .b i{background:var(--ink)}
.rk[aria-pressed="true"] .l{font-weight:700}
.rk[aria-pressed="true"] .b i{background:var(--ink)}
.rk[aria-pressed="true"] .b{background:var(--c4)}
.more{margin-top:8px}
svg text{font:500 10px var(--f-body);letter-spacing:.06em;fill:var(--muted);text-transform:uppercase}
.grid-l{stroke:var(--rule);stroke-width:1;shape-rendering:crispEdges}
.axis-l{stroke:var(--ink);stroke-width:1;shape-rendering:crispEdges}
.s0{fill:var(--c0)}.s1{fill:var(--c1)}.s2{fill:var(--c2)}.s3{fill:var(--c3)}.s4{fill:var(--c4)}.s5{fill:var(--c5)}
.dot{fill:var(--ink)}.dot0{fill:var(--rule)}
.hcell{cursor:pointer}.hcell:hover .dot{fill:var(--ink);stroke:var(--ink);stroke-width:3;stroke-opacity:.25}
.sel{fill:var(--ink);opacity:.08}
.cross{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 2}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:8px}
.legend button{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
.legend button[aria-pressed="true"]{font-weight:700;text-decoration:underline}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 9px;font-size:12px;line-height:1.35;max-width:320px;display:none;white-space:pre}
.tw{overflow:auto;height:min(460px,72vh);border-top:1px solid var(--rule);position:relative}
.tw table{border-collapse:collapse;width:100%;min-width:720px}
.tw th{position:sticky;top:0;background:var(--paper);text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
.tw th button{font-weight:500}
.tw td{padding:0 10px 0 0;height:30px;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.tw tr.r{cursor:pointer}.tw tr.r:hover td{background:var(--wash)}
.tw tr.r.on td{background:var(--c5)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--paper);border-left:1px solid var(--ink);z-index:30;overflow:auto;padding:18px 22px 40px;transform:translateX(102%);visibility:hidden}
aside.drawer.open{transform:none;visibility:visible}
.kv{display:grid;grid-template-columns:92px 1fr;gap:3px 14px;padding:7px 0;border-top:1px solid var(--rule)}
.kv button{overflow-wrap:anywhere;border-bottom:1px dotted var(--ink)}
.kv button:hover{background:var(--ink);color:var(--paper)}
pre.raw{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--f-mono);margin:10px 0 0;padding:10px;background:var(--wash)}
.empty{padding:18px 0;color:var(--muted)}
.note{margin:0 0 6px;max-width:100ch;color:var(--muted)}
.err{padding:40px 0}
footer.colophon{border-top:1px solid var(--ink);padding:14px 0 40px}
</style>
</head>
<body>
<div id="app"></div>
<!--__CFG__-->
<!--__DATA__-->
<script id="soc-app">
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var root=document.documentElement;

/* ---------- DOM helpers: every string from the data goes through textContent ---------- */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.slice(0,2)!=='on')el.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;
    el.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));}
  return el;
}
var NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){
  var el=document.createElementNS(NS,tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null)continue;if(k==='text')el.textContent=v;else el.setAttribute(k,v);}
  for(var i=2;i<arguments.length;i++)if(arguments[i])el.appendChild(arguments[i]);
  return el;
}
function clear(el){while(el.firstChild)el.removeChild(el.firstChild)}

function fail(err){
  root.setAttribute('data-error',String(err&&err.message||err));
  var a=$('app');a.appendChild(h('div',{class:'wrap err'},h('h1',{text:'Dashboard failed to render'}),h('p',{class:'mono',text:String(err&&err.stack||err)})));
}
function inflate(b64){
  if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('This dashboard needs a browser with DecompressionStream (Chrome/Edge 80+, Firefox 113+, Safari 16.4+).'));
  var bin=atob(b64),u8=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer().then(function(buf){
    var jl=new DataView(buf).getUint32(0,true),head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,jl))),base=Math.ceil((4+jl)/8)*8,D={n:head.n,num:{},str:{},raw:head.raw,meta:head.meta,signals:head.signals};
    head.layout.forEach(function(c){var arr=c.type==='f64'?new Float64Array(buf,base+c.off,c.len):new Int32Array(buf,base+c.off,c.len);
      if(c.k.slice(0,2)==='s:')D.str[c.k.slice(2)]={v:head.str[c.k.slice(2)],i:arr};else D.num[c.k]=arr});
    return D})}
var CFG;
try{CFG=JSON.parse($('soc-cfg').textContent)}catch(e){fail(e);CFG=null}
if(CFG)inflate(JSON.parse($('soc-data').textContent).b64).then(main).catch(fail);

function main(D){
try{
var theme=CFG.theme||{};
if(theme.accent)root.style.setProperty('--accent',theme.accent);
try{var saved=localStorage.getItem('soc-theme');if(saved==='light'||saved==='dark')root.setAttribute('data-theme',saved);else if(theme.mode==='light'||theme.mode==='dark')root.setAttribute('data-theme',theme.mode);}catch(e){if(theme.mode==='light'||theme.mode==='dark')root.setAttribute('data-theme',theme.mode);}

/* ---------- data ---------- */
var N=D.n,T=D.num.t,BYTES=D.num.bytes;
var NUM={sev:D.num.sev,dport:D.num.dport,sport:D.num.sport};
var COL={};
Object.keys(D.str).forEach(function(k){COL[k]={idx:D.str[k].i,vals:D.str[k].v}});
var WT=D.meta.weights||{},W=new Float32Array(N).fill(1),SAMPLED=false;
if(COL.kind){var kw=COL.kind.vals.map(function(v){return WT[v]||1});for(var i=0;i<N;i++){var ki=COL.kind.idx[i];if(ki>=0&&kw[ki]>1){W[i]=kw[ki];SAMPLED=true}}}
var tMin=T[0],tMax=T[N-1];if(tMax<=tMin)tMax=tMin+1000;
var SEVL=['INFO','LOW','MED','HIGH','CRIT'];
var SVC={21:'FTP',22:'SSH',23:'TELNET',25:'SMTP',53:'DNS',80:'HTTP',110:'POP3',123:'NTP',135:'RPC',139:'NETBIOS',143:'IMAP',389:'LDAP',443:'HTTPS',445:'SMB',465:'SMTPS',587:'SMTP',636:'LDAPS',993:'IMAPS',1433:'MSSQL',1521:'ORACLE',3306:'MYSQL',3389:'RDP',5432:'POSTGRES',5900:'VNC',5985:'WINRM',8080:'HTTP-ALT',8443:'HTTPS-ALT'};
var FIELD_NAME={t:'TIME',kind:'KIND',sev:'SEVERITY',out:'OUTCOME',act:'ACTION',src:'SOURCE',dst:'TARGET',sig:'RULE',cat:'CATEGORY',tac:'TACTIC',user:'ACCOUNT',host:'HOST',app:'SERVICE',st:'STATE',ua:'USER-AGENT',msg:'DETAIL',dport:'PORT',sport:'SRC PORT',proto:'PROTO',bytes:'BYTES','src>dst':'PAIR'};

function numCol(f){var a=NUM[f],m=new Map(),vals=[],idx=new Int32Array(N);
  for(var i=0;i<N;i++){var v=a[i];if(v<0){idx[i]=-1;continue}var j=m.get(v);if(j===undefined){j=vals.length;m.set(v,j);vals.push(String(v))}idx[i]=j}
  return {idx:idx,vals:vals}}
function pairCol(a,b){var A=col(a),B=col(b);if(!A||!B)return null;var m=new Map(),vals=[],idx=new Int32Array(N);
  for(var i=0;i<N;i++){var x=A.idx[i],y=B.idx[i];if(x<0||y<0){idx[i]=-1;continue}var key=x*65536+y,j=m.get(key);
    if(j===undefined){j=vals.length;m.set(key,j);vals.push(A.vals[x]+' → '+B.vals[y])}idx[i]=j}
  return {idx:idx,vals:vals}}
function col(f){if(COL[f])return COL[f];
  if(f==='sev'||f==='dport'||f==='sport')return COL[f]=numCol(f);
  if(f.indexOf('>')>0){var p=f.split('>');return COL[f]=pairCol(p[0],p[1])}
  return null}
function label(f,v){if(f==='sev')return SEVL[+v]||v;if(f==='dport'&&SVC[+v])return v+' '+SVC[+v];return v}

function fmtN(x){x=Math.round(x);return x.toLocaleString('en-US')}
function fmtB(b){var u=['B','KB','MB','GB','TB'],i=0;while(b>=1000&&i<4){b/=1000;i++}return (i?b.toFixed(b<10?1:0):Math.round(b))+' '+u[i]}
function fmtTs(ms){return new Date(ms).toISOString().slice(0,19).replace('T',' ')}
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtAx(ms,step){var d=new Date(ms),p=function(n){return n<10?'0'+n:''+n};
  if(step>=864e5)return DOW[d.getUTCDay()]+' '+p(d.getUTCDate());
  if(d.getUTCHours()===0&&d.getUTCMinutes()===0)return p(d.getUTCDate())+' '+MON[d.getUTCMonth()];
  return p(d.getUTCHours())+':'+p(d.getUTCMinutes())}
function fmtDur(ms){var s=ms/1e3;if(s<90)return Math.round(s)+' s';if(s<5400)return Math.round(s/60)+' min';if(s<172800)return (s/3600).toFixed(1).replace('.0','')+' h';return (s/86400).toFixed(1).replace('.0','')+' d'}
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),m=v/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}

/* ---------- filter state ---------- */
var F={t0:null,t1:null,q:'',eq:{}};
var bits={time:1,q:2},nextBit=4;
function bitFor(f){if(!bits[f]){bits[f]=nextBit;nextBit*=2}return bits[f]}
var fails=new Uint32Array(N),panels=[],maskCache={};
var QF=['sig','src','dst','user','msg','cat','host','ua','app','tac','dport','kind','out'];
function maskFor(where){var key=JSON.stringify(where||{});if(maskCache[key])return maskCache[key];
  var m=new Uint8Array(N).fill(1);
  Object.keys(where||{}).forEach(function(f){var c=col(f);if(!c){m.fill(0);return}var set={};where[f].forEach(function(v){set[v]=1});
    var ok=new Uint8Array(c.vals.length);c.vals.forEach(function(v,i){if(set[v])ok[i]=1});
    for(var i=0;i<N;i++)if(!ok[c.idx[i]])m[i]=0});
  return maskCache[key]=m}
function compute(){
  fails.fill(0);
  if(F.t0!=null)for(var i=0;i<N;i++)if(T[i]<F.t0||T[i]>=F.t1)fails[i]|=1;
  var terms=F.q.toLowerCase().split(/\s+/).filter(Boolean);
  if(terms.length){var tf=terms.map(function(term){var out=[];QF.forEach(function(f){var c=col(f);if(!c)return;var fl=new Uint8Array(c.vals.length);
      c.vals.forEach(function(v,j){if(v.toLowerCase().indexOf(term)>=0)fl[j]=1});out.push([c.idx,fl])});return out});
    for(var i=0;i<N;i++){var ok=true;for(var t=0;t<tf.length&&ok;t++){var hit=false;for(var k=0;k<tf[t].length;k++){var e=tf[t][k];if(e[1][e[0][i]]){hit=true;break}}if(!hit)ok=false}
      if(!ok)fails[i]|=2}}
  Object.keys(F.eq).forEach(function(f){var set=F.eq[f];if(!set.size)return;var c=col(f);if(!c)return;var b=bitFor(f);
    var okv=new Uint8Array(c.vals.length);c.vals.forEach(function(v,j){if(set.has(v))okv[j]=1});
    for(var i=0;i<N;i++)if(!okv[c.idx[i]])fails[i]|=b})
}
function activeBits(){return Object.keys(F.eq).reduce(function(a,f){return F.eq[f].size?a|bitFor(f):a},0)}
function visible(i,ignore){var f=fails[i];return f===0||(f&~ignore)===0}
function matchCount(){var c=0;for(var i=0;i<N;i++)if(fails[i]===0)c++;return c}

function toggleEq(f,v){focusSig=null;var s=F.eq[f]||(F.eq[f]=new Set());if(s.has(v))s.delete(v);else s.add(v);if(!s.size)delete F.eq[f];render()}
function setEq(f,vals){if(vals&&vals.length)F.eq[f]=new Set(vals);else delete F.eq[f];}
function setTime(a,b){focusSig=null;if(a==null){F.t0=F.t1=null}else{F.t0=Math.max(tMin,Math.floor(a));F.t1=Math.min(tMax+1,Math.ceil(b))}render()}
function resetAll(){F.t0=F.t1=null;F.q='';F.eq={};focusSig=null;render()}

/* ---------- hash state (shareable views) ---------- */
function readHash(){var s=location.hash.replace(/^#/,'');if(!s)return;
  s.split('&').forEach(function(p){var i=p.indexOf('=');if(i<0)return;var k=decodeURIComponent(p.slice(0,i)),v=decodeURIComponent(p.slice(i+1));
    if(k==='t'){var m=v.split('-');if(m.length===2&&isFinite(+m[0])&&isFinite(+m[1])){F.t0=+m[0];F.t1=+m[1]}}
    else if(k==='q')F.q=v;
    else if(k==='theme'&&(v==='dark'||v==='light'))root.setAttribute('data-theme',v);
    else if(k.slice(0,2)==='f.'){var f=k.slice(2);if(col(f))F.eq[f]=new Set(v.split('~').filter(Boolean))}})}
function writeHash(){var p=[];if(F.t0!=null)p.push('t='+F.t0+'-'+F.t1);if(F.q)p.push('q='+encodeURIComponent(F.q));
  Object.keys(F.eq).forEach(function(f){if(F.eq[f].size)p.push('f.'+f+'='+Array.from(F.eq[f]).map(encodeURIComponent).join('~'))});
  try{history.replaceState(null,'',p.length?'#'+p.join('&'):location.pathname+location.search)}catch(e){}}

/* ---------- tooltip ---------- */
var tip=h('div',{class:'tip',role:'presentation'});
function showTip(ev,text){tip.textContent=text;tip.style.display='block';var x=ev.clientX+14,y=ev.clientY+14,w=tip.offsetWidth,hh=tip.offsetHeight;
  if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+hh>innerHeight-8)y=ev.clientY-hh-14;tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px'}
function hideTip(){tip.style.display='none'}

/* ---------- panel: KPIs ---------- */
function kpisPanel(cfg){

  csv.addEventListener('click',function(){
    var ks=DROWS.map(function(r){return r[0]}),lines=[ks.join(',')];
    function esc(v){v=String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
    for(var k=0;k<ordered.length;k++){var i=ordered[k];lines.push(ks.map(function(f){return f==='t'?new Date(T[i]).toISOString():esc(cellVal(f,i))}).join(','))}
    var blob=new Blob([lines.join('\n')],{type:'text/csv'}),a=h('a',{download:'events-filtered.csv'});a.href=URL.createObjectURL(blob);document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)});
  return {el:box,update:update,count:function(){return ordered.length}}
}

/* ---------- shell ---------- */
var app=$('app'),chips=h('div',{class:'chips'}),qin=h('input',{type:'search',placeholder:'Search rule, address, account, detail…  ( / )','aria-label':'Search events',autocomplete:'off',spellcheck:'false'});
var title=(CFG.title||'Security dashboard'),countEl=h('span',{'aria-live':'polite'});
function metaLine(){var f=D.meta.files.map(function(x){return x.file}).join(', ');
  var parts=[['Source',f],['Window',fmtTs(tMin)+' → '+fmtTs(tMax)+' UTC ('+fmtDur(tMax-tMin)+')'],['Events',fmtN(D.meta.events_seen)+(D.meta.events_embedded<D.meta.events_seen?' seen · '+fmtN(D.meta.events_embedded)+' embedded':'')]];
  var el=h('div',{class:'meta cap mut'});parts.forEach(function(p){el.appendChild(h('span',null,p[0]+' ',h('b',{text:p[1]})))});return el}
var themeBtn=h('button',{class:'cap',text:'Theme'}),resetBtn=h('button',{class:'cap',text:'Reset'});
themeBtn.addEventListener('click',function(){var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);try{localStorage.setItem('soc-theme',nx)}catch(e){}});
resetBtn.addEventListener('click',resetAll);
var qTimer=0;qin.addEventListener('input',function(){clearTimeout(qTimer);qTimer=setTimeout(function(){F.q=qin.value.trim();render()},160)});
document.addEventListener('keydown',function(e){var tg=e.target&&e.target.tagName;
  if(e.key==='/'&&tg!=='INPUT'){e.preventDefault();qin.focus()}
  else if(e.key==='Escape'){if(drawer.classList.contains('open'))closeDrawer();else if(tg==='INPUT'){qin.value='';qin.blur();F.q='';render()}}});

function stackPanel(cfg){
  var box=h('div',{class:'stack w'+(cfg.w||4)}),subs=[];
  (cfg.panels||[]).forEach(function(p){var b=builders[p.type];if(!b)return;var pn=b(Object.assign({},p,{w:12}));if(!pn)return;subs.push(pn);box.appendChild(pn.el)});
  return {el:box,update:function(){subs.forEach(function(p){p.update()})}}}
var builders={stack:stackPanel,kpis:kpisPanel,signals:signalsPanel,timeline:timelinePanel,rank:rankPanel,heat:heatPanel,table:tablePanel};
var grid=h('main',{class:'grid'});
(CFG.panels||[]).forEach(function(p){var b=builders[p.type];if(!b)return;var pn=b(p);if(!pn)return;
  if(p.type==='signals'){pn.el.classList.add('w12')}
  panels.push(pn);grid.appendChild(pn.el)});
app.appendChild(h('div',{class:'wrap'},h('header',{class:'top'},h('div',{class:'cap mut',text:CFG.kicker||'Security analysis · offline · read-only'}),h('h1',{text:title}),metaLine())));
app.appendChild(h('div',{class:'bar'},h('div',{class:'wrap'},h('label',{class:'search'},h('span',{class:'cap mut',text:'Find'}),qin),chips,h('div',{class:'cap act'},countEl,resetBtn,themeBtn))));
var notesBox=null;
if(D.meta.notes&&D.meta.notes.length){notesBox=h('section',{class:'panel notes','aria-label':'Data notes'},h('div',{class:'ph'},h('h2',{class:'cap',text:'Data notes'}),h('span',{class:'cap mut',text:'Assumptions and omissions'})));
  D.meta.notes.forEach(function(n){notesBox.appendChild(h('p',{class:'note',text:n}))})}
if(notesBox)grid.appendChild(notesBox);
app.appendChild(h('div',{class:'wrap'},grid,h('footer',{class:'colophon cap mut'},
  'All times UTC · built '+(CFG.built||'')+' from '+D.meta.files.length+' file'+(D.meta.files.length>1?'s':'')+' · no network requests · '+(SAMPLED?'≈ marks counts from sampled bulk events ('+Object.keys(WT).filter(function(k){return WT[k]>1}).map(function(k){return k+' ×'+WT[k]}).join(', ')+') · ':'')+'signals are rule-based leads, not verdicts')));
document.body.appendChild(drawer);document.body.appendChild(tip);

function renderChips(){clear(chips);
  if(F.t0!=null){var b=h('button',{class:'chip cap',title:'Remove time filter'},h('span',{text:'Time '+fmtTs(F.t0).slice(5,16)+' → '+fmtTs(F.t1).slice(5,16)}),h('span',{text:'×'}));b.addEventListener('click',function(){setTime(null)});chips.appendChild(b)}
  Object.keys(F.eq).forEach(function(f){F.eq[f].forEach(function(v){var b=h('button',{class:'chip cap',title:'Remove filter'},h('span',{text:(FIELD_NAME[f]||f)+' '+label(f,v)}),h('span',{text:'×'}));b.addEventListener('click',function(){focusSig=null;toggleEq(f,v)});chips.appendChild(b)})});
  if(F.q){var b=h('button',{class:'chip cap',title:'Clear search'},h('span',{text:'Search '+F.q}),h('span',{text:'×'}));b.addEventListener('click',function(){qin.value='';F.q='';render()});chips.appendChild(b)}}
function render(){
  compute();renderChips();panels.forEach(function(p){p.update()});
  var mc=matchCount();countEl.textContent=fmtN(mc)+' of '+fmtN(N)+' events';root.setAttribute('data-matches',mc);root.setAttribute('data-total',N);
  if(qin.value.trim()!==F.q)qin.value=F.q;
  writeHash();
}
readHash();render();root.setAttribute('data-ready','1');
window.__soc={F:F,N:N,matchCount:matchCount,setFilter:function(f,vals){setEq(f,vals);render()},setQuery:function(q){F.q=q;render()},reset:resetAll,panels:panels.length};
}catch(err){fail(err)}
}
})();
</script>
